<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Feliz cumpleaños</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: white;
      color: black;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #pantalla {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      text-align: center;
    }

    #inicio {
      font-size: 24px;
      cursor: pointer;
    }

    #mensaje {
      font-size: 30px;
      padding: 20px;
    }

    #grupo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    #flecha {
      width: 55px;
      height: auto;
      animation: mover 0.7s infinite alternate ease-in-out;
    }

    #carta {
      display: none;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      object-fit: contain;
    }

    .negro {
      background: black;
      color: white;
    }

    .blanco {
      background: white;
      color: black;
    }

    @keyframes mover {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(12px);
      }
    }
  </style>
</head>
<body>
  <main id="pantalla" class="blanco">
    <div id="inicio">toca</div>
    <div id="grupo" style="display: none;">
      <img id="flecha" src="red.png" alt="">
      <div id="mensaje"></div>
    </div>
    <img id="carta" src="cartita.png" alt="Carta de cumpleaños">
  </main>

  <audio id="meow" src="meow.mp3" preload="auto"></audio>
  <audio id="fart" src="fart.mp3" preload="auto"></audio>
  <audio id="light" src="light.mp3" preload="auto"></audio>

  <script>
    const pantalla = document.getElementById("pantalla");
    const inicio = document.getElementById("inicio");
    const grupo = document.getElementById("grupo");
    const mensaje = document.getElementById("mensaje");
    const carta = document.getElementById("carta");

    const meow = document.getElementById("meow");
    const fart = document.getElementById("fart");
    const light = document.getElementById("light");

    function esperar(segundos) {
      return new Promise(resolve => setTimeout(resolve, segundos * 1000));
    }

    async function empezar() {
      inicio.style.display = "none";
      grupo.style.display = "flex";
      mensaje.textContent = "Feliz cumpleaños";

      meow.currentTime = 0;
      meow.play();

      await esperar(5);

      meow.pause();
      meow.currentTime = 0;
      pantalla.className = "negro";
      grupo.style.display = "none";

      fart.currentTime = 0;
      fart.play();

      await esperar(6);

      pantalla.className = "blanco";
      grupo.style.display = "flex";
      mensaje.textContent = "Feliz cumpleaño, amor";

      await esperar(4);

      mensaje.textContent = "Es broma";

      await esperar(2);

      grupo.style.display = "none";
      pantalla.className = "negro";

      light.currentTime = 0;
      light.play();

      await esperar(3);

      light.currentTime = 0;
      light.play();
      pantalla.className = "blanco";
      carta.style.display = "block";
    }

    inicio.addEventListener("click", empezar, { once: true });
  </script>
</body>
</html>
