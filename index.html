```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz cumpleaños</title>
<style>
body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background-color: #ffffff;
    color: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
    overflow: hidden;
}
.screen {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}
.hidden {
    display: none !important;
}
@keyframes arrowMove {
    0% { transform: translateX(0px); }
    50% { transform: translateX(10px); }
    100% { transform: translateX(0px); }
}
.arrow {
    width: 30px;
    height: 30px;
    margin-right: 15px;
    animation: arrowMove 1s infinite ease-in-out;
    object-fit: contain;
}
.text-container {
    display: flex;
    align-items: center;
    font-size: 24px;
    font-weight: bold;
}
.zoom-container {
    width: 100%;
    height: 100%;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: center;
}
.zoom-img {
    max-width: 80%;
    max-height: 80%;
    object-fit: contain;
    transition: transform 0.3s ease;
    cursor: pointer;
}
</style>
</head>
<body>

<audio id="meow" src="meow.mp3" preload="auto"></audio>
<audio id="fart" src="fart.mp3" preload="auto"></audio>
<audio id="light" src="light.mp3" preload="auto"></audio>

<div id="screen1" class="screen" style="background-color: white; color: black;">
    <div class="text-container">
        <img src="red.png" class="arrow" alt="Flecha" onerror="this.src='https://placehold.co/30x30/red/white?text=%3E'">
        <span>Feliz cumpleaños</span>
    </div>
</div>

<div id="screen2" class="screen hidden" style="background-color: black; color: white;">
</div>

<div id="screen3" class="screen hidden" style="background-color: white; color: black;">
    <span id="message" style="font-size: 26px; font-weight: bold;">Feliz cumpleaño, amor</span>
</div>

<div id="screen4" class="screen hidden" style="background-color: black; color: white;">
</div>

<div id="screen5" class="screen hidden" style="background-color: black; color: white;">
    <div class="zoom-container" id="zoomBox">
        <img id="carta" src="cartita.png" class="zoom-img" alt="Cartita" onerror="this.src='https://placehold.co/250x350/cccccc/333333?text=Cartita'">
    </div>
</div>

<script>
const meowAudio = document.getElementById('meow');
const fartAudio = document.getElementById('fart');
const lightAudio = document.getElementById('light');

const screen1 = document.getElementById('screen1');
const screen2 = document.getElementById('screen2');
const screen3 = document.getElementById('screen3');
const screen4 = document.getElementById('screen4');
const screen5 = document.getElementById('screen5');
const message = document.getElementById('message');
const carta = document.getElementById('carta');

let isZoomed = false;

window.onload = function() {
    meowAudio.play().catch(() => {});

    setTimeout(() => {
        meowAudio.pause();
        meowAudio.currentTime = 0;
        screen1.classList.add('hidden');
        screen2.classList.remove('hidden');
        fartAudio.play().catch(() => {});

        setTimeout(() => {
            screen2.classList.add('hidden');
            screen3.classList.remove('hidden');

            setTimeout(() => {
                message.textContent = "Es broma";

                setTimeout(() => {
                    screen3.classList.add('hidden');
                    screen4.classList.remove('hidden');
                    lightAudio.play().catch(() => {});

                    setTimeout(() => {
                        lightAudio.play().catch(() => {});
                        screen4.classList.add('hidden');
                        screen5.classList.remove('hidden');

                    }, 3000);

                }, 2000);

            }, 4000);

        }, 6000);

    }, 5000);
};

carta.addEventListener('click', function() {
    if (!isZoomed) {
        carta.style.transform = "scale(2.5)";
        isZoomed = true;
    } else {
        carta.style.transform = "scale(1)";
        isZoomed = false;
    }
});
</script>

</body>
</html>
