```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz cumpleaños</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes moveArrow {
            0% { transform: translateX(0px); }
            50% { transform: translateX(10px); }
            100% { transform: translateX(0px); }
        }
        .arrow-anim {
            animation: moveArrow 1s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-white m-0 p-0 h-screen w-screen overflow-hidden flex flex-col items-center justify-center font-sans select-none">

    <audio id="meowAudio" src="meow.mp3" preload="auto"></audio>
    <audio id="fartAudio" src="fart.mp3" preload="auto"></audio>
    <audio id="lightAudio" src="light.mp3" preload="auto"></audio>

    <div id="screen1" class="flex items-center justify-center space-x-3 transition-opacity duration-500">
        <img src="red.png" alt="Flecha" class="w-8 h-8 arrow-anim object-contain" onerror="this.src='https://placehold.co/40x40/red/white?text=→'">
        <span class="text-black text-2xl font-medium">Feliz cumpleaños</span>
    </div>

    <div id="screen3" class="hidden absolute inset-0 bg-white flex items-center justify-center">
        <h1 id="textMsg" class="text-black text-2xl font-medium px-4 text-center">Feliz cumpleaño, amor</h1>
    </div>

    <div id="screen6" class="hidden absolute inset-0 bg-black flex flex-col items-center justify-center overflow-auto p-4">
        <div id="imgContainer" class="transition-transform duration-300 cursor-pointer">
            <img id="cartaImg" src="cartita.png" alt="Cartita" class="max-w-[200px] max-h-[300px] object-contain rounded shadow-lg" onerror="this.src='https://placehold.co/200x300/f3f4f6/333333?text=Cartita+Zoom'">
        </div>
        <p class="text-white text-xs mt-4 opacity-70">Toca la carta para hacer zoom</p>
    </div>

    <script>
        let isZoomed = false;
        const meow = document.getElementById('meowAudio');
        const fart = document.getElementById('fartAudio');
        const light = document.getElementById('lightAudio');
        const screen1 = document.getElementById('screen1');
        const screen3 = document.getElementById('screen3');
        const textMsg = document.getElementById('textMsg');
        const screen6 = document.getElementById('screen6');
        const cartaImg = document.getElementById('cartaImg');
        const imgContainer = document.getElementById('imgContainer');

        function startSequence() {
            meow.play().catch(e => console.log(e));

            setTimeout(() => {
                meow.pause();
                meow.currentTime = 0;
                document.body.className = "bg-black m-0 p-0 h-screen w-screen overflow-hidden flex flex-col items-center justify-center font-sans select-none";
                screen1.classList.add('hidden');
                fart.play().catch(e => console.log(e));

                setTimeout(() => {
                    document.body.className = "bg-white m-0 p-0 h-screen w-screen overflow-hidden flex flex-col items-center justify-center font-sans select-none";
                    screen3.classList.remove('hidden');

                    setTimeout(() => {
                        textMsg.textContent = "Es broma";

                        setTimeout(() => {
                            document.body.className = "bg-black m-0 p-0 h-screen w-screen overflow-hidden flex flex-col items-center justify-center font-sans select-none";
                            screen3.classList.add('hidden');
                            light.play().catch(e => console.log(e));

                            setTimeout(() => {
                                light.play().catch(e => console.log(e));
                                screen6.classList.remove('hidden');
                            }, 3000);

                        }, 2000);

                    }, 4000);

                }, 6000);

            }, 5000);
        }

        document.body.addEventListener('click', function initOnce() {
            startSequence();
            document.body.removeEventListener('click', initOnce);
        }, { once: true });

        imgContainer.addEventListener('click', () => {
            isZoomed = !isZoomed;
            if (isZoomed) {
                imgContainer.style.transform = "scale(2.2)";
            } else {
                imgContainer.style.transform = "scale(1)";
            }
        });
    </script>
</body>
</html>
